name: Build Workflow

on:
  workflow_call:
    inputs:
      AWS_REGION:
        description: "AWS Target Region"
        required: true
        type: string
      AWS_ACCOUNT_ID:
        description: "AWS Account ID"
        required: true
        type: string
      DOCKERFILE_PATH:
        description: "Dockerfile path"
        required: false
        type: string
        default: "./Dockerfile"
      DOCKERFILE_CONTEXT:
        description: "Dockerfile context path"
        required: false
        type: string
        default: "."
      ECR_ROLE_TO_ASSUME:
        description: "Role to assume"
        required: true
        type: string
      ECR_REPO_NAME:
        description: "ECR Repo name"
        required: true
        type: string
      BUILD_ARGS:
        description: "Arguments for Docker build"
        required: false
        type: string
      MULTI_ARCH:
        description: "Build multi-architecture image"
        required: false
        type: boolean
        default: false
      IMAGE_TAG:
        description: "Image tag to push. Uses SHA-RUN_ID when omitted."
        required: false
        type: string
        default: ""
      USE_ENV_FILE:
        description: "Whether to mount ENV_FILE during the Docker build"
        required: false
        type: boolean
        default: false
      ENV_FILE_NAME:
        description: "Environment file name used during the build"
        required: false
        type: string
        default: ".env.production"
    secrets:
      ENV_FILE:
        description: "Full contents of the environment file"
        required: false
    outputs:
      ECR_REPO_URL:
        description: "ECR repository URL"
        value: ${{ jobs.build.outputs.ECR_REPO_URL }}
      IMAGE_TAG:
        description: "Pushed Docker image tag"
        value: ${{ jobs.build.outputs.IMAGE_TAG }}

env:
  AWS_AUDIENCE: "sts.amazonaws.com"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ECR_REPO_URL: ${{ steps.set_repo_name.outputs.ECR_REPO_NAME }}
      IMAGE_TAG: ${{ steps.set_image_tag.outputs.IMAGE_TAG }}
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    steps:
      - name: Set multi-architecture platforms
        id: arch
        run: |
          if [ "${{ inputs.MULTI_ARCH }}" = "true" ]; then
            echo "PLATFORMS=linux/arm64,linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "PLATFORMS=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: ${{ env.AWS_AUDIENCE }}
          role-to-assume: ${{ inputs.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Set ECR repository URL
        id: set_repo_name
        run: |
          echo "ECR_REPO_NAME=${{ inputs.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.AWS_REGION }}.amazonaws.com/${{ inputs.ECR_REPO_NAME
          }}" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: set_image_tag
        run: |
          if [ -n "${{ inputs.IMAGE_TAG }}" ]; then
            echo "IMAGE_TAG=${{ inputs.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=${GITHUB_SHA}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push with environment file
        if: ${{ inputs.USE_ENV_FILE }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.DOCKERFILE_CONTEXT }}
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          platforms: ${{ steps.arch.outputs.PLATFORMS }}
          tags: ${{ steps.set_repo_name.outputs.ECR_REPO_NAME }}:${{ steps.set_image_tag.outputs.IMAGE_TAG }}
          build-args: |
            ${{ inputs.BUILD_ARGS }}
            ENV_FILE_NAME=${{ inputs.ENV_FILE_NAME }}
          secrets: |
            "env_file=${{ secrets.ENV_FILE }}"

      - name: Build and push
        if: ${{ !inputs.USE_ENV_FILE }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.DOCKERFILE_CONTEXT }}
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          platforms: ${{ steps.arch.outputs.PLATFORMS }}
          tags: ${{ steps.set_repo_name.outputs.ECR_REPO_NAME }}:${{ steps.set_image_tag.outputs.IMAGE_TAG }}
          build-args: |
            ${{ inputs.BUILD_ARGS }}
